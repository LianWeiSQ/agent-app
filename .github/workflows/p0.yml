name: Desktop P0

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-p0-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENHARNESS_REPOSITORY: LianWeiSQ/openharness
  OPENHARNESS_REF: codex/rust-desktop-workspace-checkpoint

jobs:
  p0:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout Desktop app
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout shared Rust harness
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OPENHARNESS_REPOSITORY }}
          ref: ${{ env.OPENHARNESS_REF }}
          path: openharness

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux Desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install App dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run complete P0 gate
        working-directory: app
        run: npm run ci:p0
